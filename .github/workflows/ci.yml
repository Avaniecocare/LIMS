name: CI
on:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  # pull_request (never pull_request_target) gives fork PRs no secrets and a read-only token.
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: lims, POSTGRES_PASSWORD: lims, POSTGRES_DB: lims_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lims" --health-interval 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://lims:lims@localhost:5432/lims_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Generate OpenAPI document
        run: node --env-file=.env.example dist/openapi.js openapi.json
        env:
          DATABASE_URL: postgresql://lims:lims@localhost:5432/lims_test
          REDIS_URL: redis://localhost:6379/1
      - run: npm run openapi:check
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-${{ github.sha }}
          path: openapi.json
  image:
    if: github.event_name == 'push'
    needs: [gitleaks, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/avaniecocare/lims
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
