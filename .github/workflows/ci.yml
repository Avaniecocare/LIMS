name: CI
on:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  # pull_request (never pull_request_target) gives fork PRs no secrets and a read-only token.
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # The gitleaks CLI itself (MIT), not gitleaks-action, which needs a paid licence on org repos.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: lims, POSTGRES_PASSWORD: lims, POSTGRES_DB: lims_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lims" --health-interval 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://lims:lims@localhost:5432/lims_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - name: Unused files, exports and dependencies
        run: npm run knip
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Generate OpenAPI document
        run: node --env-file=.env.example dist/openapi.js openapi.json
        env:
          DATABASE_URL: postgresql://lims:lims@localhost:5432/lims_test
          REDIS_URL: redis://localhost:6379/1
      - run: npm run openapi:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-${{ github.sha }}
          path: openapi.json
  # One build per architecture, each on its own kind of runner: argon2 is compiled and emulation is slow. The
  # per-architecture tags are only parts; `image` joins them into the tags people use.
  image-build:
    if: github.event_name == 'push'
    needs: [gitleaks, test]
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/avaniecocare/lims:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      # The same image for customers, which needs a licence. Only when the repository variable holds the public key.
      - if: vars.LICENCE_PUBLIC_KEY != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/avaniecocare/lims:sha-${{ github.sha }}-licensed-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            "LICENCE_PUBLIC_KEY=${{ vars.LICENCE_PUBLIC_KEY }}"
          cache-from: type=gha,scope=${{ matrix.arch }}
  image:
    if: github.event_name == 'push'
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/avaniecocare/lims
          # :main is what LIMS-UI's e2e job runs against unless LIMS_PINNED_VERSION is set there.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/build/') }}
            type=sha,format=long
      - name: Publish one image for both architectures
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ghcr.io/avaniecocare/lims:sha-${{ github.sha }}
          LICENSED: ${{ vars.LICENCE_PUBLIC_KEY != '' }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE-amd64" "$SOURCE-arm64"
          if [ "$LICENSED" = true ]; then
            args=()
            while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag-licensed"); done <<< "$TAGS"
            docker buildx imagetools create "${args[@]}" "$SOURCE-licensed-amd64" "$SOURCE-licensed-arm64"
          fi
