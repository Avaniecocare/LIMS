# Local development: `docker compose up` starts the API, worker and dependencies,
# runs migrations and loads the demo seed. Everything here is fictional.
name: lims-dev
x-app: &app
  build: .
  env_file: .env.example
  environment: &app-env
    DATABASE_URL: postgresql://lims:lims@postgres:5432/lims
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    SMTP_HOST: mailpit
    COMPANY_BRANDING_DIR: /app/branding-demo/bluepeak
  volumes:
    - ./branding-demo:/app/branding-demo:ro
services:
  postgres:
    image: postgres:18-alpine
    environment: { POSTGRES_USER: lims, POSTGRES_PASSWORD: lims, POSTGRES_DB: lims }
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U lims'], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 3s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck: { test: ['CMD', 'mc', 'ready', 'local'], interval: 3s, timeout: 3s, retries: 20 }
  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']
  migrate:
    <<: *app
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/seed/cli.js seed']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  api:
    <<: *app
    command: ['node', 'dist/main.js', 'api']
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
  worker:
    <<: *app
    command: ['node', 'dist/main.js', 'worker']
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
volumes:
  pgdata:
  miniodata:
